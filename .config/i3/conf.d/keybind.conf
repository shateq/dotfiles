# Part of my i3 setup
#mod4+n reserved for removing dunst notification

set $mod Mod4
set $alt Mod1

set $term kitty
set $menu rofi -show drun | xargs swaymsg exec --
set $dmenu rofi -show run | xargs swaymsg exec -- 
# wont ever use wofi, gtk is ugly, configuring it was hard

set $left h
set $down j
set $up k
set $right l

