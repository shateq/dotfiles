# https://wiki.hyprland.org/Configuring/

source = conf.d/*
################
### MONITORS ###
monitor = LVDS-1, preferred, 0x0, 1
monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###

$terminal = kitty
$fileManager = $terminal -e yazi
$menu = tofi-drun | xargs hyprctl dispatch exec --

exec-once = waybar &
exec-once = mako &
exec-once = wl-paste --type text --watch cliphist store
# exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle

exec-once = kdeconnectd
exec-once = kdeconnect-indicator

#############################
### ENVIRONMENT VARIABLES ###

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,18
env = HYPRCURSOR_SIZE,18

#####################
### LOOK AND FEEL ###

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 15

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    allow_tearing = false

    layout = dwindle
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_on_top = true
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
}

#############
### INPUT ###

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pl,us
    kb_variant = colemak
    kb_model =
    kb_options = caps:backspace,grp:ctrls_toggle
    kb_rules =

    follow_mouse = 1

    touchpad {
        tap-to-click = false
        natural_scroll = true
    }
}

###################
### KEYBINDINGS ###
$mod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod ALT, C, exec, hyprpicker

bind = $mod, Q, killactive,
bind = $mod ALT, BackSpace, exit,

bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1

# LAYOUTS
bind = $mod SHIFT, M, exec, hyprctl keyword general:layout "master"
bind = $mod SHIFT, Return, layoutmsg, swapwithmaster

bind = $mod SHIFT, V, togglefloating,
bind = $mod SHIFT, P, pseudo, # dwindle
bind = $mod, S, togglesplit, # dwindle

# Groups
bind = $mod, T, togglegroup
bind = $mod SHIFT, T, lockgroups, toggle
bind = $mod CTRL, P, changegroupactive, b
bind = $mod CTRL, N, changegroupactive, f

bind = $mod, bracketleft, moveintogroup, l
bind = $mod, bracketright, moveoutofgroup

bind = $mod SHIFT, D, tagwindow, dimmer
# bind = $mod, G, pin, active

bind = $mod ALT, V, exec, cliphist list | rofi -dmenu -display-columns 2 | cliphist decode | wl-copy

# Focus
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Monitors
bind = $mod ALT, H, focusmonitor, l
bind = $mod ALT, L, focusmonitor, r
bind = $mod CTRL SHIFT, H, movewindow, mon:l
bind = $mod CTRL SHIFT, L, movewindow, mon:r
# bind = $mod CTRL SHIFT, K, movewindow, u
# bind = $mod CTRL SHIFT, J, movewindow, d

bind = $mod CTRL SHIFT, X, swapactiveworkspaces, current l

# Resize
binde = $mod, Minus, resizeactive, -6% 0
binde = $mod, Equal, resizeactive, 6% 0
binde = $mod SHIFT, Minus, resizeactive, 0 -6%
binde = $mod SHIFT, Equal, resizeactive, 0 6%

bind = ALT, TAB, cyclenext, previous
bind = $mod, TAB, workspace, previous
bind = $mod SHIFT, TAB, movetoworkspace, previous


bind = $mod, X, togglespecialworkspace, music
bind = $mod, Z, togglespecialworkspace, magic
bind = $mod SHIFT, Z, movetoworkspace, special:magic

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, N, workspace, e+1
bind = $mod, P, workspace, e-1

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = , Print, exec, grim -g "$(slurp -d)" - | wl-copy
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Zoom
# binde = $mod CTRL, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
# binde = $mod CTRL, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
# bind = $mod, equal, exec, hyprctl -q keyword cursor:zoom_factor 1

# Disable all keybinds
bind = $mod, Escape, submap, clean
submap = clean
bind = $mod, Escape, submap, reset
submap = reset
